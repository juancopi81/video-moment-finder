name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Prepare isolated migration test image
        run: docker pull postgres:16-alpine

      - name: Run backend and isolated migration tests
        env:
          VMF_RUN_POSTGRES_TESTS: "1"
        run: uv run --frozen --no-sync pytest -q

      - name: Validate portable plugin archive
        run: |
          uv run --frozen --no-sync python -m unittest discover -s scripts/plugin -p 'test_*.py'
          uv run --frozen --no-sync python scripts/plugin/build_package.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Test account messages and source timestamps
        run: node tests/account-and-source-links.test.mjs

      - name: Run frontend build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
