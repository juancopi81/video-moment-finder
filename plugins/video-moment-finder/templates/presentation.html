<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
:root{font:18px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17283f;background:#eaf0f7}*{box-sizing:border-box}body{margin:0}header{max-width:1120px;margin:34px auto 22px;padding:0 24px}h1{font-size:2rem;letter-spacing:-.04em;margin:0}header p{margin:.5rem 0}.meta{color:#52637a;font-size:.85rem}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer;background:#fff;color:#17283f;border:1px solid #acbbd0;padding:8px 15px;border-radius:5px}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #245bdd;outline-offset:3px}button:disabled{opacity:.4;cursor:default}main{max-width:1120px;margin:auto;padding:0 24px}.slide{background:white;margin:0 0 30px;box-shadow:0 5px 22px #25385312;scroll-margin-top:20px}.slide-inner{min-height:590px;padding:44px 58px 30px;display:flex;flex-direction:column}.label{text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:.7rem;color:#52637a;margin:0 0 20px}.slide h2{font-size:clamp(1.9rem,3.8vw,3.1rem);line-height:1.13;letter-spacing:-.04em;margin:0 0 30px;max-width:950px}.composition{flex:1;display:flex;align-items:center;gap:40px}.copy{flex:1}.copy p{max-width:800px;margin:0 0 20px}.headline{font-size:clamp(2.4rem,5vw,4.4rem);line-height:1.12;letter-spacing:-.035em;color:#245bdd;font-weight:700;margin-bottom:24px!important}.cover .slide-inner{background:#17283f;color:white;min-height:590px}.cover .label,.cover .slide-footer{color:#bfcee4}.cover h2{font-size:clamp(2.6rem,5vw,4.4rem);max-width:800px}.cover .headline{color:#9dbbff}.cover .copy{max-width:780px}.exercise .slide-inner{background:#e7f2f2}.exercise .headline{color:#087e83}figure{flex:1;margin:0;min-width:0}figure img{width:100%;max-height:300px;object-fit:contain;background:#101010}figcaption{color:#52637a;font-size:.72rem;line-height:1.45;margin-top:12px}.evidence .copy{flex:.9}.evidence .headline{font-size:2.5rem}.columns{display:grid;grid-template-columns:1fr 1fr;gap:48px;width:100%;margin-top:22px}.columns h3{font-size:1.7rem;line-height:1.2;color:#245bdd;margin:0 0 14px}.columns section+section h3{color:#087e83}.comparison .composition{display:block}.comparison .copy p{font-size:.95rem;color:#52637a}.columns p{font-size:1.12rem}.slide-footer{display:flex;justify-content:space-between;gap:20px;color:#52637a;font-size:.65rem;padding-top:26px;margin-top:auto}.slide-footer a{color:inherit;text-underline-offset:3px}.slide-footer span:first-child{max-width:90%}details{border-top:1px solid #e0e6ef;padding:14px 24px;color:#52637a;font-size:.85rem}summary{cursor:pointer}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;max-width:900px;color:#17283f}footer{max-width:1120px;margin:30px auto;padding:0 24px;color:#52637a;font-size:.83rem}[hidden]{display:none!important}body.presenting .slide{display:none}body.presenting .slide.active{display:block}body.presenting .slide-inner{min-height:65vh}@media(max-width:700px){header{margin-top:22px}.slide-inner{padding:26px 24px;min-height:520px}.composition{display:block}.headline{overflow-wrap:anywhere}.copy p{font-size:.96rem}figure{margin-top:25px}.columns{grid-template-columns:1fr;gap:24px}figure img{max-height:240px}.slide-footer{font-size:.65rem}main{padding:0 12px}h1{font-size:1.6rem}.cover .slide-inner{min-height:520px}}@media print{@page{size:landscape;margin:8mm}header,.toolbar,details,footer{display:none}body,main{margin:0;padding:0;background:#fff}.slide,body.presenting .slide{display:block;break-after:page;margin:0;box-shadow:none}.slide-inner,.cover .slide-inner{height:175mm;min-height:0}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><header><h1>{{TITLE}}</h1><p class="meta">{{AUDIENCE}} · {{COVERAGE}} · {{COUNT}} slides</p><div class="toolbar"><button id="mode" aria-pressed="false">Present one slide</button><button id="prev" disabled aria-label="Previous slide">← Previous</button><output id="position" aria-live="polite">1 / {{COUNT}}</output><button id="next" aria-label="Next slide">Next →</button><button id="print">Print / Save PDF</button></div></header><main>{{SLIDES}}</main><footer>{{GAPS}}<p>This preview works offline. Use the accompanying PowerPoint export when provided for editable slide text and speaker notes. Browser printing is available; this page itself is HTML.</p></footer><script>
const slides=[...document.querySelectorAll('.slide')];let current=0,presenting=false;
function update(){slides.forEach((s,i)=>s.classList.toggle('active',i===current));document.getElementById('position').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}
function move(delta){current=Math.max(0,Math.min(slides.length-1,current+delta));update();if(!presenting)slides[current].scrollIntoView({block:'start'})}
document.getElementById('mode').onclick=()=>{presenting=!presenting;document.body.classList.toggle('presenting',presenting);document.getElementById('mode').setAttribute('aria-pressed',String(presenting));document.getElementById('mode').textContent=presenting?'Show all slides':'Present one slide';update()};document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(!presenting||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});update();
</script></body></html>
